<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850">
<style>
* { font-family: "Ubuntu", "Helvetica", "Arial", sans-serif; }
.fill-fg { fill: #c8d0ff; }
.stroke-fg { stroke: #c8d0ff; }
.fill-bg { fill: #0a0a1a; }
.stroke-bg { stroke: #0a0a1a; }
.fill-weak { fill: #4a5580; }
.stroke-weak { stroke: #4a5580; }
.radar {
stroke-width: 4px;
stroke: #7850ff;
fill: #7850ff;
fill-opacity: 0.5;
}
</style>
<rect x="0" y="0" width="1280" height="850" class="fill-bg"></rect>
<!-- Grille de contributions avec couleurs bleu/violet -->
<g>
<!-- Exemple simplifié - les vraies données GitHub seraient ici -->
<rect x="140" y="154" width="18" height="18" fill="#7850ff" class="stroke-bg" stroke-width="1px"></rect>
<rect x="160" y="154" width="18" height="18" fill="#4a30c0" class="stroke-bg" stroke-width="1px"></rect>
<rect x="180" y="154" width="18" height="18" fill="#b8a0e8" class="stroke-bg" stroke-width="1px"></rect>
<rect x="200" y="154" width="18" height="18" fill="#1a1060" class="stroke-bg" stroke-width="1px"></rect>
<rect x="220" y="154" width="18" height="18" fill="#e8e0ff" class="stroke-bg" stroke-width="1px"></rect>
</g>
<text x="1260" y="830" font-size="24px" class="fill-fg" text-anchor="end">137 contributions</text>
</svg>
