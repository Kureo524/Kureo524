name: GitHub-Profile-3D-Contrib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      # Génère les SVGs via l'action yoshi389111
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ./settings.json

      # Installe rsvg-convert (librsvg) pour la conversion SVG→PNG
      - name: Install rsvg-convert
        run: sudo apt-get update -qq && sudo apt-get install -qq -y librsvg2-bin

      # Nettoie le SVG 3D isométrique et convertit en PNG minimal
      - name: Generate minimal 3D contributions PNG
        run: python3 profile-3d-contrib/svg_to_minimal_png.py profile-3d-contrib/profile-blue-violet.svg profile-3d-contrib/contrib-3d-minimal.png

      # Commit & Push
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
